[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlinclude"
dynamic = ["version"]
description = "Tiny SQL source preprocessor: expand @include directives and @define variables."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lukasbursky", email = "lukasbursky@gmail.com" }]
keywords = ["sql", "preprocessor", "include", "bigquery", "templating"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Pre-processors",
]

[project.scripts]
sqlinclude = "sqlinclude.cli:main"

[project.urls]
Homepage = "https://github.com/lukasbursky/sqlinclude"
Source = "https://github.com/lukasbursky/sqlinclude"
Issues = "https://github.com/lukasbursky/sqlinclude/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.dynamic]
version = { attr = "sqlinclude.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
